name: Publish Ask Shropshire

on:
  push:
    branches: [main]
    paths:
      - "docs/ask-shropshire/**"
      - ".github/workflows/ask-shropshire-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ask-shropshire-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Ask Shropshire site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/ask-shropshire
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
