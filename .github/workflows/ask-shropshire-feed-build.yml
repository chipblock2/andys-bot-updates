name: Build Ask Shropshire public feed

on:
  push:
    branches: [ask-shropshire-data]
    paths:
      - '.github/workflows/ask-shropshire-feed-build.yml'
      - 'ask-shropshire/sync-input/**'
      - 'ask-shropshire/staging/ready.json'

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ask-shropshire-data
          fetch-depth: 0

      - name: Rebuild and validate public feeds
        shell: python
        run: |
          import glob, json, os
          from datetime import datetime, timezone

          ROOT='ask-shropshire'
          LEGACY=os.path.join(ROOT,'sync-input')
          STAGE=os.path.join(ROOT,'staging')
          now=datetime.now(timezone.utc)
          generated=now.isoformat().replace('+00:00','Z')

          def load(path):
              with open(path,encoding='utf-8') as f: text=f.read()
              text=text.lstrip()
              obj,end=json.JSONDecoder().raw_decode(text)
              tail=text[end:].strip()
              if tail:
                  print(f'Ignoring trailing staging artefact in {path}: {tail[:80]!r}')
              return obj

          def dump(path,obj):
              with open(path,'w',encoding='utf-8') as f:
                  json.dump(obj,f,ensure_ascii=False,separators=(',',':'))

          def dt(v):
              if not v: return None
              return datetime.fromisoformat(v.replace('Z','+00:00'))

          def norm(v):
              return ' '.join(str(v or '').strip().lower().split())

          base_events=load(os.path.join(ROOT,'events.json'))['events']
          root_places=load(os.path.join(ROOT,'places.json'))['places']
          root_offers=load(os.path.join(ROOT,'offers.json'))['offers']
          root_tips=load(os.path.join(ROOT,'tips.json'))['tips']

          expected_path=os.path.join(STAGE,'expected.json')
          if os.path.exists(expected_path):
              expected=load(expected_path)
          else:
              expected={'events':len(base_events),'places':len(root_places),'offers':len(root_offers),'tips':len(root_tips)}

          by_id={x['id']:x for x in base_events}
          overlaid=0
          event_paths=sorted(glob.glob(os.path.join(LEGACY,'events-*.json')) + glob.glob(os.path.join(STAGE,'events-*.json')))
          for path in event_paths:
              staged=load(path)
              if isinstance(staged,dict): staged=staged.get('events',[])
              assert all(x.get('status')=='Published' for x in staged), 'Non-Published event in public staging'
              for x in staged:
                  if x['id'] in by_id: overlaid+=1
                  by_id[x['id']]=x
          raw=list(by_id.values())

          by_key={}
          duplicates=[]
          for x in raw:
              ext=norm(x.get('external_id'))
              key=('external:'+ext) if ext else ('id:'+x['id'])
              if key in by_key:
                  duplicates.append(key)
                  old=by_key[key]
                  if str(x.get('last_checked') or '') > str(old.get('last_checked') or ''):
                      by_key[key]=x
              else:
                  by_key[key]=x
          deduped=list(by_key.values())

          expired=[]
          events=[]
          for x in deduped:
              end=dt(x.get('end'))
              if end and end <= now:
                  expired.append(x)
              else:
                  events.append(x)
          events.sort(key=lambda x:(x.get('start') or '9999',norm(x.get('name'))))
          assert len(events)==expected['events'], f"Event set mismatch: events={len(events)} expected={expected['events']} duplicates={len(duplicates)} expired={len(expired)}"

          def staged_or_root(filename,key,root_value):
              for directory in (STAGE,LEGACY):
                  path=os.path.join(directory,filename)
                  if os.path.exists(path):
                      obj=load(path)
                      return obj.get(key,[]) if isinstance(obj,dict) else obj
              return root_value

          places=staged_or_root('places.json','places',root_places)
          offers=staged_or_root('offers.json','offers',root_offers)
          tips=staged_or_root('tips.json','tips',root_tips)
          assert all(x.get('status')=='Published' for x in places), 'Non-Published place in public set'
          assert all(x.get('status')=='Published' for x in offers), 'Non-Published offer in public set'
          assert all(x.get('status')=='Published' for x in tips), 'Non-Published tip in public set'

          def unique(items,keyfn):
              out={}
              dups=[]
              for x in items:
                  key=keyfn(x)
                  if key in out:
                      dups.append(key)
                  else:
                      out[key]=x
              return list(out.values()),dups

          places,place_duplicates=unique(places,lambda x:norm(x.get('name')))
          offers,offer_duplicates=unique(offers,lambda x:norm(x.get('id') or f"{x.get('name')}|{x.get('business_venue')}|{x.get('start')}"))
          tips,tip_duplicates=unique(tips,lambda x:norm(f"{x.get('tip')}|{x.get('place_business')}|{x.get('town')}"))

          current_offers=[]
          expired_offers=[]
          for x in offers:
              end=dt(x.get('end'))
              if end and end <= now:
                  expired_offers.append(x)
              else:
                  current_offers.append(x)

          assert len(places)==expected['places'], f"Expected {expected['places']} places, got {len(places)}"
          assert len(current_offers)==expected['offers'], f"Expected {expected['offers']} current offers, got {len(current_offers)}"
          assert len(tips)==expected['tips'], f"Expected {expected['tips']} tips, got {len(tips)}"

          dump(os.path.join(ROOT,'events.json'),{'generated_at':generated,'source':'Ask Shropshire Content Hub','events':events})
          dump(os.path.join(ROOT,'places.json'),{'generated_at':generated,'source':'Ask Shropshire Content Hub','places':places})
          dump(os.path.join(ROOT,'offers.json'),{'generated_at':generated,'source':'Ask Shropshire Content Hub','offers':current_offers})
          dump(os.path.join(ROOT,'tips.json'),{'generated_at':generated,'source':'Ask Shropshire Content Hub','tips':tips})

          confirmed=load(os.path.join(ROOT,'events.json'))['events']
          assert len(confirmed)==len(events), 'Main events feed re-open validation failed'
          assert {x['id'] for x in confirmed}=={x['id'] for x in events}, 'Main events feed does not match validated event set'
          assert all(x.get('status')=='Published' for x in confirmed), 'Main events feed contains non-Published record'

          dump(os.path.join(ROOT,'events-extra.json'),{'generated_at':generated,'source':'Ask Shropshire temporary overlay','events':[]})

          report={
              'events':len(events),
              'places':len(places),
              'offers':len(current_offers),
              'tips':len(tips),
              'event_duplicates':len(duplicates),
              'place_duplicates':len(place_duplicates),
              'offer_duplicates':len(offer_duplicates),
              'tip_duplicates':len(tip_duplicates),
              'expired_events':len(expired),
              'expired_offers':len(expired_offers),
              'event_overlays':overlaid
          }
          dump(os.path.join(ROOT,'feed-sync-report.json'),report)
          print(json.dumps(report))

      - name: Publish validated feed
        run: |
          rm -rf ask-shropshire/sync-input ask-shropshire/staging
          git config user.name 'Ask Shropshire Feed Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A ask-shropshire
          if git diff --cached --quiet; then
            echo 'No feed changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh Ask Shropshire public feed [skip ci]'
          git push origin HEAD:ask-shropshire-data
