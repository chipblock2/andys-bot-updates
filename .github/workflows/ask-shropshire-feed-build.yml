name: Build Ask Shropshire public feed

on:
  push:
    branches: [ask-shropshire-data]
    paths:
      - '.github/workflows/ask-shropshire-feed-build.yml'
      - 'ask-shropshire/sync-input/**'

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ask-shropshire-data
          fetch-depth: 0

      - name: Rebuild and validate public feeds
        shell: python
        run: |
          import glob, json, os
          from datetime import datetime, timezone

          ROOT='ask-shropshire'
          IN=os.path.join(ROOT,'sync-input')
          now=datetime.now(timezone.utc)
          generated=now.isoformat().replace('+00:00','Z')

          def load(path):
              with open(path,encoding='utf-8') as f: return json.load(f)
          def dump(path,obj):
              with open(path,'w',encoding='utf-8') as f:
                  json.dump(obj,f,ensure_ascii=False,separators=(',',':'))
          def dt(v):
              if not v: return None
              return datetime.fromisoformat(v.replace('Z','+00:00'))
          def norm(v): return ' '.join(str(v or '').strip().lower().split())

          raw=[]
          for path in sorted(glob.glob(os.path.join(IN,'events-*.json'))): raw.extend(load(path))
          assert len(raw)==138, f'Expected 138 staged Published events, got {len(raw)}'
          assert all(x.get('status')=='Published' for x in raw), 'Non-Published event in public staging'

          by_key={}
          duplicates=[]
          for x in raw:
              ext=norm(x.get('external_id'))
              key=('external:'+ext) if ext else ('id:'+x['id'])
              if key in by_key:
                  duplicates.append(key)
                  old=by_key[key]
                  if str(x.get('last_checked') or '') > str(old.get('last_checked') or ''): by_key[key]=x
              else: by_key[key]=x
          deduped=list(by_key.values())
          expired=[]
          events=[]
          for x in deduped:
              end=dt(x.get('end'))
              if end and end <= now: expired.append(x)
              else: events.append(x)
          events.sort(key=lambda x:(x.get('start') or '9999',norm(x.get('name'))))
          assert len(events)+len(expired)==len(deduped), 'Event validation mismatch'

          places=load(os.path.join(IN,'places.json'))
          offers=load(os.path.join(IN,'offers.json'))
          tips=load(os.path.join(IN,'tips.json'))
          assert all(x.get('status')=='Published' for x in places), 'Non-Published place in staging'
          assert all(x.get('status')=='Published' for x in offers), 'Non-Published offer in staging'
          assert all(x.get('status')=='Published' for x in tips), 'Non-Published tip in staging'

          def unique(items,keyfn):
              out={}
              for x in items: out.setdefault(keyfn(x),x)
              return list(out.values())
          places=unique(places,lambda x:norm(x.get('name')))
          offers=unique(offers,lambda x:norm(x.get('id') or f"{x.get('name')}|{x.get('business_venue')}|{x.get('start')}"))
          tips=unique(tips,lambda x:norm(f"{x.get('tip')}|{x.get('place_business')}|{x.get('town')}"))
          current_offers=[]
          expired_offers=[]
          for x in offers:
              end=dt(x.get('end'))
              if end and end <= now: expired_offers.append(x)
              else: current_offers.append(x)

          assert len(places)==13, f'Expected 13 places, got {len(places)}'
          assert len(current_offers)==0, f'Expected 0 current offers, got {len(current_offers)}'
          assert len(tips)==4, f'Expected 4 tips, got {len(tips)}'

          dump(os.path.join(ROOT,'events.json'),{'generated_at':generated,'source':'Ask Shropshire Content Hub','events':events})
          dump(os.path.join(ROOT,'places.json'),{'generated_at':generated,'source':'Ask Shropshire Content Hub','places':places})
          dump(os.path.join(ROOT,'offers.json'),{'generated_at':generated,'source':'Ask Shropshire Content Hub','offers':current_offers})
          dump(os.path.join(ROOT,'tips.json'),{'generated_at':generated,'source':'Ask Shropshire Content Hub','tips':tips})

          # Re-open the rebuilt main feed before clearing the temporary overlay.
          confirmed=load(os.path.join(ROOT,'events.json'))['events']
          assert len(confirmed)==len(events), 'Main events feed re-open validation failed'
          assert {x['id'] for x in confirmed}=={x['id'] for x in events}, 'Main events feed does not match validated Airtable export'
          dump(os.path.join(ROOT,'events-extra.json'),{'generated_at':generated,'source':'Ask Shropshire temporary overlay','events':[]})

          report={'events':len(events),'places':len(places),'offers':len(current_offers),'tips':len(tips),'event_duplicates':len(duplicates),'expired_events':len(expired),'expired_offers':len(expired_offers)}
          dump(os.path.join(ROOT,'feed-sync-report.json'),report)
          print(json.dumps(report))

      - name: Publish validated feed
        run: |
          rm -rf ask-shropshire/sync-input
          git config user.name 'Ask Shropshire Feed Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A ask-shropshire
          if git diff --cached --quiet; then
            echo 'No feed changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh Ask Shropshire public feed [skip ci]'
          git push origin HEAD:ask-shropshire-data
